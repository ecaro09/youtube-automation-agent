services:
  youtube-automation-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: youtube-automation-agent
    env_file:
      - .env
    ports:
      - "3456:3456"
    volumes:
      - ./config:/app/config
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped
    command: ["node", "index.js"]
